# TNL-Go Master Server Configuration File
# Lines starting with # are comments

# Port to listen on (default: 29005)
port 29005

# Message of the Day (MOTD) entries
# Format: motd <game_type_pattern> "<message>"
# The pattern is matched against the game string, longest match wins
# Use * to match all game types

motd * "Welcome to TNL-Go Master Server! Have a great time gaming!"
motd MasterServerTestGame "Welcome to the TNL-Go test environment!"
motd TestGame "This is a test game server - enjoy testing!"
motd ZAP "Welcome to ZAP - the ultimate space combat game!"

# You can add more MOTD entries for different game types
# The server will pick the best matching MOTD based on the game string